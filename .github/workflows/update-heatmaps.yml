name: Update Profile Widgets

on:
  schedule:
    # Runs once a day at 00:15 UTC. Edit the cron expression to change frequency.
    - cron: "15 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate heatmaps
        env:
          CF_HANDLE: mumm00z          # <- your Codeforces handle
          CC_HANDLE: mumm00z # <- your CodeChef handle (leave blank "" to skip)
          ALL_YEARS: "true"           # "true" = stacked calendar for every year of CF history
                                       # "false" = single row, last 53 weeks only
        run: python scripts/generate_heatmap.py

      - name: Generate tech stack
        env:
          GH_USERNAME: MezbahUddin21
          GH_TOKEN: ${{ secrets.TECHSTACK_TOKEN }}  # PAT with full "repo" scope -- see SETUP.md
          INCLUDE_FORKS: "false"                    # "true" to count languages from forked repos too
          INCLUDE_PRIVATE: "true"                   # "true" to also scan your private repos
          TOP_N_LANGUAGES: "10"
        run: python scripts/generate_techstack.py

      - name: Generate trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: MezbahUddin21
          file: dist/trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}   # PAT with read:user + public_repo scopes -- see SETUP.md
          theme: gitdimmed        # matches the theme already used elsewhere in the README
          no-frame: "true"
          no-background: "true"   # transparent, so it blends with the dark README background
          margin-width: "15"
          max-cols: "7"

      - name: Ensure trophy SVG lands in dist/
        run: |
          mkdir -p dist
          if [ -f trophy.svg ] && [ ! -f dist/trophy.svg ]; then
            mv trophy.svg dist/trophy.svg
          fi

      - name: Relabel trophy text
        run: |
          if [ -f dist/trophy.svg ]; then
            sed -i 's/God Repo Creator/Master Repo Creator/g' dist/trophy.svg
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*.svg dist/tech-stack.md README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile widgets (heatmaps + tech stack + trophies)"
            git push
          fi
